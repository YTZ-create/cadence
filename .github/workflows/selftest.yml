name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recovery score
        run: python -X utf8 workspace/scripts/recovery_score.py --selftest
      - name: Energy score
        run: python -X utf8 workspace/scripts/energy_score.py selftest
      - name: Reaction test
        run: python -X utf8 workspace/scripts/reaction_test.py selftest
